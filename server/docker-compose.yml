# 시놀로지 Container Manager > 프로젝트에서 이 파일을 그대로 씁니다.
#
# 올리기 전에 두 가지만 바꿔 주세요.
#   1) EVLOG_TOKEN — 아무도 못 맞출 긴 무작위 문자열. 앱과 웹이 함께 씁니다.
#   2) volumes 경로 — NAS에 실제로 있는 폴더로.

services:
  evlog:
    build: .
    container_name: evlog
    restart: unless-stopped
    ports:
      # 왼쪽이 NAS 포트입니다. 다른 것과 겹치면 바꾸세요.
      - "8123:8080"
    environment:
      EVLOG_TOKEN: "여기에-아주-긴-무작위-문자열을-넣으세요"
      TZ: "Asia/Seoul"
    volumes:
      # 기록이 저장되는 곳. 이 폴더만 백업하면 전부 백업됩니다.
      - /volume1/docker/evlog/data:/data
