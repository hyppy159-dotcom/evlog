# 시놀로지 Container Manager > 프로젝트에서 이 파일을 그대로 씁니다.
#
# 올리기 전에 두 가지만 바꿔 주세요.
#   1) EVLOG_TOKEN — 아무도 못 맞출 긴 무작위 문자열. 앱이 기록을 올릴 때 씁니다.
#   2) volumes 경로 — NAS에 실제로 있는 폴더로. (data 폴더는 미리 만들어 두세요)
#
# 웹페이지는 토큰이 아니라 아이디/비밀번호로 들어갑니다.
# 처음 열었을 때 화면에서 한 번 정하면 되고, 여기에 적을 것은 없습니다.

services:
  evlog:
    build: .
    container_name: evlog
    restart: unless-stopped
    ports:
      # 왼쪽이 NAS 포트입니다. 다른 것과 겹치면 바꾸세요.
      - "8127:8080"
    environment:
      EVLOG_TOKEN: "여기에-아주-긴-무작위-문자열을-넣으세요"
      TZ: "Asia/Seoul"
      # 웹 비밀번호를 잊었을 때만 잠깐 "1"로 바꿔 재시작하세요.
      # 계정이 지워져 웹페이지에서 다시 만들 수 있게 됩니다. 그 뒤 꼭 "0"으로 되돌리세요.
      # 기록은 지워지지 않습니다.
      EVLOG_RESET_LOGIN: "0"
    volumes:
      # 기록이 저장되는 곳. 이 폴더만 백업하면 전부 백업됩니다.
      - /volume1/docker/evlog/data:/data
