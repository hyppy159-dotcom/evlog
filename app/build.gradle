plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jhkim.evlog'
    compileSdk 34

    defaultConfig {
        applicationId "com.jhkim.evlog"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.1.0"
    }

    // 서명 키를 저장소에 함께 넣어 두어, 어디서 빌드하든 같은 서명이 나오게 합니다.
    // (같은 서명이어야 새 APK를 지우지 않고 덮어 설치할 수 있습니다.)
    signingConfigs {
        evlog {
            storeFile file('../keystore/evlog.jks')
            storePassword 'evlog2026'
            keyAlias 'evlog'
            keyPassword 'evlog2026'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.evlog
        }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.evlog
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.fragment:fragment:1.8.2'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'com.google.android.material:material:1.12.0'
}
